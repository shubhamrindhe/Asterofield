<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta name="author" content="shubhamrindhe" id="author"/>
    <title>Garage</title>
	<link rel="stylesheet" href="stylesheets/spacecraft.css" type="text/css" />
</head>

<body>

	<span class="spacecraft centroid" id="spacecraft">
		<span class="head"></span>
		<span class="left-wing">
			<span class="thruster"></span>
		</span>
		<span class="body">
			<span class="thruster"></span>
		</span>
		<span class="right-wing">
			<span class="thruster"></span>
		</span>
		<span class="tail">
			<span class="v-stabilizer-left"></span>
			<span class="h-stabilizer"></span>
			<span class="v-stabilizer-right"></span>
		</span>
	</span>
	
	
	<svg width="50" height="50" style="border:1px solid red;" class="centroid">
		
		<line x1="50" y1="25" x2="50" y2="75" style="stroke:blue;stroke-width:5" stroke-linecap="round"/>
		<line x1="25" y1="50" x2="75" y2="50" style="stroke:blue;stroke-width:5" stroke-linecap="round"/>
		
		<path 
			d="M20 50 L30 45 L30 55 Z"
			style="stroke:blue;fill:blue;stroke-width:5" stroke-linecap="round"/>
		<path 
			d="M80 50 L70 45 L70 55 Z"
			style="stroke:blue;fill:blue;stroke-width:5" stroke-linecap="round"/>	
			
		<path  
			d="M50 20 L45 30 L55 30 Z"
			style="stroke:blue;fill:blue;stroke-width:5" stroke-linecap="round"/>
		<path  
			d="M50 80 L45 70 L55 70 Z"
			style="stroke:blue;fill:blue;stroke-width:5" stroke-linecap="round"/>
		
	
	
	</svg>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
	<title>snowfallEffect</title>
	<style>
		body{
			padding:0;
			margin:0;
			background-color:#ccc;
		}
		canvas{
			position:absolute;
			left:50%;
			top:50%;
			transform:translate(-50%,-50%);
			border: 2px solid black;
				
		}
		/*#status{
			position:absolute;
			left:0px;
			top:0px;
			width:200px;
			height:30px;
			background-color:black;
			color:gray;
		}*/
		
	</style>
			
			
			
		

<script>
var canvas,context;

var spaceship =
{
    color: "black",
    width: 8,
    height: 22,
    position:
    {
        x: innerWidth/2,
        y: innerHeight/2
    },
    velocity:
    {
        x: 0,
        y: 0
    },
    angle: Math.PI / 2,
    engineOn: false,
    rotatingLeft: false,
    rotatingRight: false,
    crashed: false
}

onload = function(){
	initCanvas();
	draw();
	
	
};
function initCanvas(){
	canvas = document.getElementById('canvas');
	canvas.style.position = 'fixed';
	canvas.width = innerWidth;
	canvas.height = innerHeight;
	//canvas.style.backgroundColor = 'red';
	
	context = canvas.getContext('2d');
}


function drawSpaceship()
{
    context.save();
    context.beginPath();
    context.translate(spaceship.position.x, spaceship.position.y);
    context.rotate(spaceship.angle);
    context.rect(spaceship.width * -0.5, spaceship.height * -0.5, spaceship.width, spaceship.height);
    context.fillStyle = spaceship.color;
    context.fill();
    context.closePath();

    // Draw the flame if engine is on
    if(spaceship.engineOn)
    {
        context.beginPath();
        context.moveTo(spaceship.width * -0.5, spaceship.height * 0.5);
        context.lineTo(spaceship.width * 0.5, spaceship.height * 0.5);
        context.lineTo(0, spaceship.height * 0.5 + Math.random() * 10);
        context.lineTo(spaceship.width * -0.5, spaceship.height * 0.5);
        context.closePath();
        context.fillStyle = "orange";
        context.fill();
    }
    context.restore();
}

function updateSpaceship()
{
    if(spaceship.rotatingRight)
    {
        spaceship.angle += Math.PI / 180;
    }
    else if(spaceship.rotatingLeft)
    {
        spaceship.angle -= Math.PI / 180;
    }

    if(spaceship.engineOn)
    {
        spaceship.position.x += Math.sin(spaceship.angle);
        spaceship.position.y -= Math.cos(spaceship.angle);
    }
}


function draw()
{
    // Clear entire screen
    context.clearRect(0, 0, canvas.width, canvas.height);

    updateSpaceship();

    // Begin drawing
    drawSpaceship();
    /* other draw methods (to add later) */

    requestAnimationFrame(draw);
}

function keyLetGo(event)
{
    console.log(spaceship);
    switch(event.keyCode)
    {
        case 37:
            // Left Arrow key
            spaceship.rotatingLeft = false;
            break;
        case 39:
            // Right Arrow key
            spaceship.rotatingRight = false;
            break;
        case 38:
            // Up Arrow key
            spaceship.engineOn = false;
            break;
    }
}

document.addEventListener('keyup', keyLetGo);

function keyPressed(event)
{
    console.log(spaceship);
    switch(event.keyCode)
    {
        case 37:
            // Left Arrow key
            spaceship.rotatingLeft = true;
            break;
        case 39:
            // Right Arrow key
            spaceship.rotatingRight = true;
            break;
        case 38:
            // Up Arrow key
            spaceship.engineOn = true;
            break;
    }
}

document.addEventListener('keydown', keyPressed);


</script>

</head>

<body id="body" >
			<canvas  id="canvas" width="100%" height="100%"></canvas>
</body>
</html>

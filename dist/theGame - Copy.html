<head>

	<title>theGame</title>
	<style>
		body{
			padding:0;
			margin:0;
			background-color:grey;
		}
		#status{
			position:absolute;
			left:5px;
			top:5px;
		}
		#joystick{
			position:absolute;
			/*top:calc(100%-100px);*/
			left:50%;
			transform: translate(-50%,0%);
			display:block;
		}
		#joystick : hover{
			background-color:black;
		}
		.control{
			width:30px;
			height:30px;
			background-color:red;
			border-radius:50%;
			text-align:center;
			float:left;
			margin:10px;
		}
		.control:hover{
			background-color:blue;
		}

	<script type="text/javascript">
		var canvas,ctx;
		
		
		var stars = new Array();
		var particles = [];
		var fireworks = [];
		var fallout = new Array();
		var mouse = {
				x : undefined,
				y : undefined
			};
		var blastColor = ['orange','yellow','grey'];
		
	// Game Data ->
		var enemies = [];
		var launcher;
		var enemiesElemenated=0;
		var difficulty=.5;
		var animateInterval;
		var launcherVelocity =10;
		var enemiesize = 40;
		var joystick;
		var left;
		var right;
		var fire;
		var spaceship = {
					color: "black",
					width: 8,
					height: 22,
					position : {
						x: 20,
						y: 20
					},
					velocity : {
						x: 0,
						y: 0
					},
					angle : Math.PI / 2,
					engineOn : false,
					rotatingLeft : false,
					rotatingRight : false,
					crashed : false
		}
		var missile = {
				velocity : 5,
				flame : 30,
				w : 5,
				h : 10,
				color : 'white',
		}
			
			
		var full;

		
		window.onload = function(load){
			full = document.getElementById('full');
			full.addEventListener('click',function(){document.body.requestFullscreen();});
			initiate.canvas('canvas',innerWidth-100,innerHeight-100);
			joystick = document.getElementById('joystick');
			
			launcher = new Launcher();
			initiate.enemies(6);
		
			//animateInterval = setInterval(animate,30);
			animate();
			setControls();			
		};
		window.onmousemove = function(evt){
			mouse.x = evt.x;
			mouse.y = evt.y;
		};
		window.onmousedown = function (){
				//alert(typeof fallout);
				//fallout = new Array();
				//initiate.blast(fallout,30,mouse.x,mouse.y);
				//alert(fallout.length);
				canvas.requestFullscreen();
		};
		
		
		function animate(){
		
				window.requestAnimationFrame(animate);
				ctx.save();
				
				
				ctx.clearRect(0,0,canvas.width,canvas.height);
				//ctx.fillStyle = 'rgba(0,0,0,.5)';
				//ctx.fillRect(0,0,canvas.width,canvas.height) 
				initiate.background(stars,50);
				launcher.update();
				renderEnemies();	
				
				if(fallout.length != 0){
					
					fallout.forEach(function(particle){
						particle.update();
						//particle.draw();
					});
				}
				
				
				ctx.restore();
				
		}
		
		
		
		
		function renderEnemies(){
				for( var i=0 ; i < enemies.length ; ++i ){
					ctx.fillStyle = 'red';
					ctx.fillRect( enemies[i].x - enemies[i].w/2, enemies[i].y - enemies[i].h/2 , enemies[i].w , enemies[i].h );
					enemies[i].y+=difficulty 
				}
		}
		
		
		
		function Launcher(){
		
					this.y = canvas.height-75,
					this.x = canvas.width*.5,
					this.w = 100,
					this.h = 75,
					this.dir,
					this.bg="orange",
					this.missiles= new Array();
					this.velocity = {
						x : launcherVelocity ,
						y : undefined
					},
						
					this.update = function(){
						this.control();
						if(	this.missiles.length != 0 )
							this.renderMissiles();
						//this.render.missiles();
						//this.render.launcher();
						this.renderLauncher();
						if( enemies.length == 0 )
							this.gameOver();
				
					}//update
					
					this.render = {
						
						missiles : function(){
								for( var i=0 ; i < this.missiles.length ; ++i){
									var m = this.missiles[i];
									ctx.fillStyle = m.bg;
									ctx.fillRect(m.x-m.w/2,m.y -=5,m.w,m.h);
									this.hitDetect(m,i);
									if(m.y<=0){
										this.missiles.splice(i,1);
									}
								}
						
						},
						
						launcher : function(){
								ctx.fillStyle = this.bg;
							
								//ctx.fillRect(this.x-this.w/2,this.y-this.h/2,this.w,this.h);
								
								ctx.beginPath();
									ctx.moveTo(this.x,this.y-30);
									ctx.lineTo(this.x-10,this.y-15);
									ctx.lineTo(this.x-50,this.y+10);
									ctx.lineTo(this.x+50,this.y+10);
									ctx.lineTo(this.x+10,this.y-15);
								
								ctx.closePath();
								ctx.fill();
						
						},
					
					
					
					}
					
					this.renderLauncher = function(){
							ctx.fillStyle = this.bg;
							
							//ctx.fillRect(this.x-this.w/2,this.y-this.h/2,this.w,this.h);
							
							ctx.beginPath();
								
								ctx.moveTo(this.x,this.y-30);
								ctx.lineTo(this.x-10,this.y-15);
								ctx.lineTo(this.x-50,this.y+10);
								ctx.lineTo(this.x+50,this.y+10);
								ctx.lineTo(this.x+10,this.y-15);
								ctx.lineTo(this.x,this.y-30);
							
								ctx.moveTo(this.x-10,this.y+10);
								ctx.lineTo(this.x-10,this.y+20);
								ctx.lineTo(this.x-15,this.y+25);
								ctx.lineTo(this.x+15,this.y+25);
								ctx.lineTo(this.x+10,this.y+20);
								ctx.lineTo(this.x+10,this.y+10);
							
							ctx.closePath();
							ctx.fill();
							ctx.stroke();
							
							
					
					}
					this.renderMissiles = function(){
							
							for( var i=0 ; i < this.missiles.length ; ++i){
								var m = this.missiles[i];
								ctx.fillStyle = m.bg;
								ctx.fillRect(m.x-m.w/2,m.y-m.h/2,m.w,m.h);
								
								///flame
								ctx.beginPath()
								ctx.moveTo( m.x-m.w/2 , m.y+m.h/2 );
								ctx.lineTo( m.x , m.y+m.h/2 + Math.random()*missile.flame );
								ctx.lineTo(m.x+m.w/2,m.y+m.h/2);
								ctx.fillStyle = 'orange';
								ctx.closePath();
								ctx.fill();
								ctx.beginPath()
								ctx.moveTo( m.x-m.w/2 , m.y+m.h/2 );
								ctx.lineTo( m.x , m.y+m.h/2 + Math.random()*( missile.flame/(missile.flame/10) ));
								ctx.lineTo(m.x+m.w/2,m.y+m.h/2);
								ctx.fillStyle = 'yellow';
								ctx.closePath();
								ctx.fill();
								
								
								this.hitDetect(m,i);
								if( m.y < 0 || m.x < 0 ){
									this.missiles.splice(i,1);
								}
								
								//updateMissiles
								m.y -= missile.velocity; 
							}
							
							/*
							missiles.forEach(function(m){
								//var m = this.missiles[i];
								ctx.fillStyle = m.bg;
								ctx.fillRect(m.x-m.w/2,m.y -=5,m.w,m.h);
								this.hitDetect(m,i);
								if(m.y<=0){
									this.missiles.splice(i,1);
								}	
							});
							*/
							
					}
					
					
					this.control = function(){
							if( this.dir == 'left' && this.x - this.w/2 > 0 ){
								this.x -= this.velocity.x;
							}else if( this.dir == 'right' && this.x + this.w/2 < canvas.width ){
								this.x += this.velocity.x;
							}
					}
					
					this.hitDetect = function(m,mi){
						for( var i=0; i < enemies.length ;i++){
							var e = enemies[i];
							//if( m.x + m.w >= e.x && m.x <= e.x +e.w && m.y >= e.y && m.y <= e.y + e.h ){
							if( distance(m,e).r <= r(e.w/2,e.h/2,0,0) ){
								if(++enemiesElemenated%6==0){
									difficulty+=.3;
								}
								initiate.blast(fallout,30,e.x,e.y);
								this.missiles.splice(mi,1);											
								//enemies.splice(i,1);
								enemies[i]= {'id':enemies.id,'x':Math.floor(Math.random()*canvas.width),'y':-20,'bg':'red','w':enemiesize,'h':enemiesize/2};
								document.getElementById('status').innerHTML = e.id+" Destroyed !!";
							}
						}
					}//hitDetect
					
					this.gameOver = function(){
							clearInterval(animateInterval);
							ctx.fillStyle = '#FC0';
							ctx.font = 'italic bold 36px Arial,sans-serif';
							ctx.fillText("level Complete",canvas.width*.5-130,50,300);
					}
					
		}//Launcher
		
		
		
		
		function Particle(x,y,r){
				
					this.x = x;
				
					this.y = y;
					this.r = r;
					this.color = blastColor[Math.floor(Math.random()*blastColor.length)];
					this.a=1;
					
					
					this.radian = Math.random()*Math.PI*2;
					this.speed = random(3,5);
					this.velocity={
						x : this.speed*Math.cos(this.radian), 
						y : this.speed*Math.sin(this.radian) 
					};
					this.gravity = {
						x : 0,
						y : 0.09,
					}
					
					
							
					this.draw = function(){
						
						ctx.beginPath();
						ctx.strokeStyle = this.color;
						ctx.fillStyle = this.color;
						ctx.lineWidth = 2;
						ctx.arc(this.x,this.y,this.r,0,Math.PI*2,true);
						ctx.stroke();
						ctx.fill();
						ctx.closePath();			
						
					}
					this.update = function(particles){
						this.draw();
						//this.a -= 0.006;
						this.r -= 0.5;
						if(  this.r<0){
							fallout.splice(fallout.indexOf(this),1);
						}
						this.velocity.y += this.gravity.y;	//gravity
						
						this.x += this.velocity.x;
						this.y += this.velocity.y;
						
						
								
					}
					

		}
		
		
		
		
		
		
		
		
		
		
		
		var initiate = {
			canvas : function(id,W,H){
				canvas = document.getElementById(id);
				canvas.style.position = 'absolute';
				canvas.style.left = '50%';
				canvas.style.top = '50%';
				canvas.style.transform = 'translate(-50%,-50%)';
				canvas.width = W;
				canvas.height = H;
				canvas.style.backgroundColor = 'black';//'lightblue';
				ctx = canvas.getContext('2d');
			},
			enemies : function(n){
				for(var i=0;i<n;++i)
					enemies.push({'id':i,'x':Math.floor(Math.random()*canvas.width)-100,'y':-20,'bg':'red','w':enemiesize,'h':enemiesize/2});
			
			},	
			particles : function ( array , n ){
							for(var i=0;i<n;++i){
								var rad =random(.5,2);
								var x=random(rad,innerWidth-rad);
								var y=random(rad,innerHeight-rad);
								
								if(i!=0){
									for(var j=0;j< array.length;++j){
										if( distance(x,y,array[j].x,array[j].y)-2*rad < 0){
											x=random(rad,innerWidth-rad);
											y=random(rad,innerHeight-rad);
											j=-1;
										}
									}
								}
								array.push( new Particle(x,y,rad));
							}
			},
			blast : function(array,n,x,y){
						for(var i=0;i<n;++i){
								var rad = random(10,20);	
								array.push( new Particle(x,y,rad));
								
						}
			},
			background : function(array,n){
						if(array.length<n){
								var x = 1 + Math.floor(Math.random()*canvas.width);
								var y = Math.floor(Math.random()*canvas.height);
								var s = 1 + Math.floor(Math.random()*2);
								array.push( { "x":x , "y":y , "s":s} );
						}
						for( var i=0 ; i < array.length ; ++i ){
							ctx.fillStyle = 'rgba(255,255,255,.70)';
							ctx.beginPath();
							ctx.arc( array[i].x , array[i].y += array[i].s*.5 , array[i].s*.5 , 0 , Math.PI*2 , true );
							ctx.fill();
							ctx.closePath();
							if( array[i].y > canvas.height ){
								array.splice(i,1);
							}
						}
			
			},
		}

						if(stars.length<100){

		//keyboard controls
		document.onkeydown = function(evt){
				switch (evt.keyCode) {
					case 37 :
						launcher.dir = 'left';
						break;					
					case 39 :
						launcher.dir = 'right';
						break;				
					case 32 :
						launcher.missiles.push( {"x":launcher.x,"y":launcher.y-launcher.h/2,"w":missile.w,"h":missile.h,"bg":missile.color} );
						break;
					default:
				}
		};
		document.onkeyup = function(){
					launcher.dir = ''; 
					
		};

		function setControls(){
			joystick.style.top = (innerHeight-50) +'px';
		}
		
		
		
		function random(a,b){
			return a + (b-a)*Math.random();
		}
		function floor(x){
			return Math.floor(x);
		}
		
		function distance(a,b){
			var dx = Math.abs(a.x - b.x);
			var dy = Math.abs(a.y - b.y);
			return {	x : dx , y : dy , r : r(dx,dy,0,0)	};
		}
		function r(x,y,x1,y1){
			return Math.sqrt((x-x1)*(x-x1)+(y-y1)*(y-y1));
		}

	</script>
